<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img" aria-labelledby="t d" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif'>
<title id="t">Puntos de control y caché de RAM deciden si los chats largos sobreviven</title><desc id="d">Tiempo real de una petición, escala logarítmica. Los modelos híbridos (Gated DeltaNet) no pueden reutilizar parte de la caché sin un punto de control</desc>
<rect x="0.5" y="0.5" width="879" height="469" rx="10" fill="#ffffff" stroke="#d0d7de"/>
<text x="24" y="36" font-size="19" font-weight="700" fill="#1f2328">Puntos de control y caché de RAM deciden si los chats largos sobreviven</text>
<text x="24" y="58" font-size="13" fill="#57606a">Tiempo real de una petición, escala logarítmica. Los modelos híbridos (Gated DeltaNet) no pueden reutilizar parte de la</text>
<text x="24" y="73" font-size="13" fill="#57606a">caché sin un punto de control</text>
<line x1="400" y1="92" x2="400" y2="372" stroke="#e6e8eb"/><text x="400" y="390" font-size="11" text-anchor="middle" fill="#57606a">1</text><line x1="550" y1="92" x2="550" y2="372" stroke="#e6e8eb"/><text x="550" y="390" font-size="11" text-anchor="middle" fill="#57606a">10</text><line x1="700" y1="92" x2="700" y2="372" stroke="#e6e8eb"/><text x="700" y="390" font-size="11" text-anchor="middle" fill="#57606a">100</text><line x1="850" y1="92" x2="850" y2="372" stroke="#e6e8eb"/><text x="850" y="390" font-size="11" text-anchor="middle" fill="#57606a">1000</text><text x="625" y="410" font-size="12" text-anchor="middle" fill="#57606a">segundos (escala logarítmica)</text><text x="24" y="106" font-size="13" font-weight="700" fill="#1f2328">Qwen3.8-27B, vuelta a un chat de 65,7K tokens</text><text x="24" y="121" font-size="13" font-weight="700" fill="#1f2328">tras una petición ajena</text><text x="390" y="151" font-size="12" text-anchor="end" fill="#1f2328">cache-ram 4096, 32 puntos (el estado no cabe)</text><rect x="400" y="134" width="371.6" height="26" rx="3" fill="#cf222e"/><text x="779.6" y="151" font-size="12" font-weight="700" fill="#1f2328">≥ 300 s</text><text x="390" y="185" font-size="12" text-anchor="end" fill="#1f2328">cache-ram 8192, 8 puntos</text><rect x="400" y="168" width="170.0" height="26" rx="3" fill="#1a7f37"/><text x="578.0" y="185" font-size="12" font-weight="700" fill="#1f2328">13,6 s</text><text x="24" y="234" font-size="13" font-weight="700" fill="#1f2328">Qwen3.6-35B-A3B, petición de resumen de compactación</text><text x="24" y="249" font-size="13" font-weight="700" fill="#1f2328">(prefijo de 126K tokens de un chat de 161K)</text><text x="390" y="279" font-size="12" text-anchor="end" fill="#1f2328">4 puntos de control</text><rect x="400" y="262" width="374.3" height="26" rx="3" fill="#cf222e"/><text x="782.3" y="279" font-size="12" font-weight="700" fill="#1f2328">313 s</text><text x="390" y="313" font-size="12" text-anchor="end" fill="#1f2328">8 puntos de control</text><rect x="400" y="296" width="175.1" height="26" rx="3" fill="#1a7f37"/><text x="583.1" y="313" font-size="12" font-weight="700" fill="#1f2328">14,7 s</text><text x="390" y="347" font-size="12" text-anchor="end" fill="#1f2328">32 puntos de control (por omisión)</text><rect x="400" y="330" width="177.3" height="26" rx="3" fill="#0969da"/><text x="585.3" y="347" font-size="12" font-weight="700" fill="#1f2328">15,2 s</text><text x="400" y="426" font-size="11" fill="#57606a">≥ cota inferior: la prueba se cortó a los 300 s</text>
<text x="24" y="456" font-size="11" fill="#57606a">Fuente: data/prompt-cache-checkpoints.json</text>
</svg>
