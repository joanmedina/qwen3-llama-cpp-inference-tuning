<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" role="img" aria-labelledby="t d" font-family='-apple-system, "Segoe UI", Helvetica, Arial, sans-serif'>
<title id="t">Dónde se va el tiempo en el uso real de Qwen3.6 por agentes</title><desc id="d">461 peticiones de agentes de programación; análisis de solo lectura del registro de llama-server (antes de ajustar nada)</desc>
<rect x="0.5" y="0.5" width="879" height="439" rx="10" fill="#ffffff" stroke="#d0d7de"/>
<text x="24" y="36" font-size="20" font-weight="700" fill="#1f2328">Dónde se va el tiempo en el uso real de Qwen3.6 por agentes</text>
<text x="24" y="58" font-size="13" fill="#57606a">461 peticiones de agentes de programación; análisis de solo lectura del registro de llama-server (antes de ajustar nada)</text>
<text x="24" y="150" font-size="14" font-weight="700" fill="#1f2328">Tiempo del modelo</text><text x="24" y="170" font-size="12" fill="#57606a">56,0 min</text><rect x="220.0" y="118" width="471.9" height="64" fill="#0969da"/><text x="455.9" y="146" font-size="15" font-weight="700" text-anchor="middle" fill="#fff">Generando tokens</text><text x="455.9" y="166" font-size="12" text-anchor="middle" fill="#fff">42,9 min · 77 %</text><rect x="691.9" y="118" width="144.1" height="64" fill="#8c959f"/><text x="764.0" y="146" font-size="11" font-weight="700" text-anchor="middle" fill="#fff">Procesando el prompt</text><text x="764.0" y="166" font-size="12" text-anchor="middle" fill="#fff">13,1 min</text><text x="24" y="280" font-size="14" font-weight="700" fill="#1f2328">Tokens del prompt</text><text x="24" y="300" font-size="12" fill="#57606a">9,47 M</text><rect x="220.0" y="248" width="587.7" height="64" fill="#1a7f37"/><text x="513.8" y="276" font-size="15" font-weight="700" text-anchor="middle" fill="#fff">Leído de la caché de prefijo</text><text x="513.8" y="296" font-size="12" text-anchor="middle" fill="#fff">95,4 %</text><rect x="807.7" y="248" width="28.3" height="64" fill="#d4670a"/><text x="836" y="338" font-size="12" text-anchor="end" fill="#d4670a">Procesado de verdad: 4,6 %</text><text x="24" y="392" font-size="13" fill="#1f2328">La generación domina; el prompt apenas cuesta porque la caché de prefijo funciona. Por eso se acelera la generación y se protege la caché.</text>
<text x="24" y="426" font-size="11" fill="#57606a">Fuente: data/real-usage-profile.json</text>
</svg>
