<text x="24" y="36" font-size="20" font-weight="700" fill="#1f2328">Where the time goes in real agent use of Qwen3.6</text>
<text x="24" y="58" font-size="13" fill="#57606a">461 requests from coding agents; read-only analysis of the llama-server log (before any tuning)</text>
<text x="24" y="150" font-size="14" font-weight="700" fill="#1f2328">Model time</text><text x="24" y="170" font-size="12" fill="#57606a">56.0 min</text><rect x="220.0" y="118" width="471.9" height="64" fill="#0969da"/><text x="455.9" y="146" font-size="15" font-weight="700" text-anchor="middle" fill="#fff">Generating tokens</text><text x="455.9" y="166" font-size="12" text-anchor="middle" fill="#fff">42.9 min · 77 %</text><rect x="691.9" y="118" width="144.1" height="64" fill="#8c959f"/><text x="764.0" y="146" font-size="11" font-weight="700" text-anchor="middle" fill="#fff">Processing the prompt</text><text x="764.0" y="166" font-size="12" text-anchor="middle" fill="#fff">13.1 min</text><text x="24" y="280" font-size="14" font-weight="700" fill="#1f2328">Prompt tokens</text><text x="24" y="300" font-size="12" fill="#57606a">9.47 M</text><rect x="220.0" y="248" width="587.7" height="64" fill="#1a7f37"/><text x="513.8" y="276" font-size="15" font-weight="700" text-anchor="middle" fill="#fff">Read from the prefix cache</text><text x="513.8" y="296" font-size="12" text-anchor="middle" fill="#fff">95.4 %</text><rect x="807.7" y="248" width="28.3" height="64" fill="#d4670a"/><text x="836" y="338" font-size="12" text-anchor="end" fill="#d4670a">Actually processed: 4.6 %</text><text x="24" y="392" font-size="13" fill="#1f2328">Generation dominates; the prompt is cheap because the prefix cache works. Hence: speed up generation and protect the cache.</text>
