name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Every script is syntactically valid
        run: for f in $(git ls-files '*.mjs'); do node --check "$f"; done
      - name: Every JSON file parses
        run: for f in $(git ls-files '*.json'); do node -e 'JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"))' "$f"; done
      - name: Every relative link resolves
        run: node tools/check-links.mjs
      - name: Figures are reproducible from data/
        run: node figures/make-figures.mjs && git diff --exit-code -- figures
