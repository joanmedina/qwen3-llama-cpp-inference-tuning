version = 1

; Router preset for llama-server (--models-preset). One section per model; every key is a llama-server long option without the leading dashes.
; The router reads this file ONLY when it starts. Paths and device names are examples: adapt them. See docs/en/06-recipes.md for the reason of every line.
;   llama-server --models-preset models.ini --models-max 3 --host 127.0.0.1 --port 8080 --api-key <key>

[*]
jinja = true
n-gpu-layers = 999
flash-attn = on
parallel = 1
cache-type-k = q8_0
cache-type-v = q8_0
metrics = true
reasoning-format = deepseek
reasoning = on
reasoning-budget = 8192
batch-size = 2048
ubatch-size = 1024

; ---------------------------------------------------------------------------------------------------------------------------------------
; Day-to-day model: Qwen3.6-35B-A3B (MoE, ~3B active). Loaded at start.
[qwen3.6]
model = /models/Qwen_Qwen3.6-35B-A3B-Q4_K_M.gguf
mmproj = /models/mmproj-Qwen_Qwen3.6-35B-A3B-f16.gguf
mmproj-device = Vulkan0
image-max-tokens = 1024
ctx-size = 262144
device = Vulkan0
spec-type = draft-mtp,ngram-mod
spec-draft-n-max = 2
reasoning-budget-message = Stop thinking: act now.
cache-ram = 8192
ctx-checkpoints = 32
temp = 0.6
top-p = 0.95
top-k = 20
min-p = 0
repeat-penalty = 1.0
load-on-startup = true

; ---------------------------------------------------------------------------------------------------------------------------------------
; Heavy / complex-task model: Qwen3.8-27B (dense). Loaded on demand.
[qwen3.8-27b]
model = /models/Qwen3.8-27B-Q4_K_M.gguf
mmproj = /models/mmproj-Qwen3.8-27B-BF16.gguf
mmproj-device = Vulkan0
image-max-tokens = 1024
ctx-size = 131072
device = Vulkan0
spec-type = draft-mtp,ngram-mod
spec-draft-n-max = 2
reasoning-effort = medium
cache-ram = 8192
ctx-checkpoints = 8
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0
repeat-penalty = 1.0
load-on-startup = false
